openapi: 3.1.0
info:
  title: SensorHub API
  version: 1.0.0
  description: V1 REST contract. Authentication, Device/Sensor CRUD, credential lifecycle and telemetry ingestion are implemented; measurement query endpoints remain planned.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
    description: Planned API base path
tags:
  - name: Authentication
    description: User registration and session management.
  - name: Devices
    description: User-owned devices and their credentials.
  - name: Sensors
    description: Measurement channels attached to devices.
  - name: Measurements
    description: Historical sensor measurements.
  - name: Telemetry
    description: Device-to-platform telemetry ingestion.
paths:
  /sanctum/csrf-cookie:
    get:
      tags: [Authentication]
      operationId: initializeSpaCsrf
      summary: Initialize the first-party SPA CSRF cookie
      servers: [{ url: / }]
      security: []
      responses:
        '204': { description: XSRF-TOKEN and session cookies initialized }
        '4XX': { description: Client request could not be completed }
  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '419': { $ref: '#/components/responses/CsrfFailure' }
  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Start a user session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '204': { description: Session started }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '419': { $ref: '#/components/responses/CsrfFailure' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutUser
      summary: End a user session
      security: [{ sanctumCookie: [] }]
      responses:
        '204': { description: Session ended }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '419': { $ref: '#/components/responses/CsrfFailure' }
  /auth/user:
    get:
      tags: [Authentication]
      operationId: getAuthenticatedUser
      summary: Return the authenticated user
      security: [{ sanctumCookie: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List owned devices
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      security: [{ sanctumCookie: [] }]
      responses:
        '200':
          description: Device collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Devices]
      operationId: createDevice
      summary: Create a device
      security: [{ sanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRequest' }
      responses:
        '201':
          description: Device created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /devices/{device}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      operationId: getDevice
      summary: Show an owned device
      security: [{ sanctumCookie: [] }]
      responses:
        '200':
          description: Device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Devices]
      operationId: updateDevice
      summary: Update an owned device
      security: [{ sanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceUpdateRequest' }
      responses:
        '200':
          description: Device updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Devices]
      operationId: deleteDevice
      summary: Remove an owned device
      security: [{ sanctumCookie: [] }]
      responses:
        '204': { description: Device removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /devices/{device}/sensors:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Sensors]
      operationId: listDeviceSensors
      summary: List sensors for a device
      security: [{ sanctumCookie: [] }]
      responses:
        '200':
          description: Sensor collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensorCollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Sensors]
      operationId: createSensor
      summary: Create a sensor
      security: [{ sanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensorRequest' }
      responses:
        '201':
          description: Sensor created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /devices/{device}/sensors/{sensor}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/SensorId'
    get:
      tags: [Sensors]
      operationId: getSensor
      summary: Show a sensor
      security: [{ sanctumCookie: [] }]
      responses:
        '200':
          description: Sensor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Sensors]
      operationId: updateSensor
      summary: Update a sensor
      security: [{ sanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensorUpdateRequest' }
      responses:
        '200':
          description: Sensor updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Sensors]
      operationId: deleteSensor
      summary: Remove a sensor
      security: [{ sanctumCookie: [] }]
      responses:
        '204': { description: Sensor removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /devices/{device}/credentials:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Devices]
      operationId: createDeviceCredential
      summary: Create a device credential
      security: [{ sanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCredentialRequest' }
      responses:
        '201':
          description: Credential created; plaintext token is returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /devices/{device}/credentials/{credential}/rotate:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/CredentialId'
    post:
      tags: [Devices]
      operationId: rotateDeviceCredential
      summary: Rotate a device credential
      security: [{ sanctumCookie: [] }]
      responses:
        '201':
          description: Replacement credential created and selected old credential revoked; plaintext token is returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /devices/{device}/credentials/{credential}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/CredentialId'
    delete:
      tags: [Devices]
      operationId: revokeDeviceCredential
      summary: Revoke a device credential
      security: [{ sanctumCookie: [] }]
      responses:
        '204': { description: Credential revoked; repeated revocation is idempotent }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sensors/{sensor}/measurements:
    parameters:
      - $ref: '#/components/parameters/SensorId'
    get:
      tags: [Measurements]
      operationId: listMeasurements
      summary: Query measurements for a sensor
      security: [{ sanctumCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: Measurement collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementCollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /devices/{device}/telemetry:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Telemetry]
      operationId: ingestTelemetry
      summary: Ingest a batch of device measurements
      description: Bearer token must belong to the addressed Device. Readings persist atomically; repeated sensor keys require distinct normalized timestamps. Unknown or soft-deleted sensors and unit mismatches reject the entire batch.
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelemetryRequest' }
      responses:
        '201':
          description: Telemetry persisted atomically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    sanctumCookie:
      type: apiKey
      in: cookie
      name: sensorhub_session
      description: Stateful Laravel Sanctum session cookie. CSRF is required for state-changing requests.
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: SensorHubDeviceToken
  parameters:
    DeviceId: { name: device, in: path, required: true, schema: { type: string, format: ulid } }
    SensorId: { name: sensor, in: path, required: true, schema: { type: string, format: ulid } }
    CredentialId: { name: credential, in: path, required: true, schema: { type: string, format: ulid } }
    From: { name: from, in: query, required: false, schema: { type: string, format: date-time } }
    To: { name: to, in: query, required: false, schema: { type: string, format: date-time } }
    Page: { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
    PerPage: { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
  responses:
    CsrfFailure:
      description: Missing or invalid CSRF token for a state-changing SPA request
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    TooManyRequests:
      description: Login rate limit exceeded
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: Missing or invalid authentication
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: Authenticated principal does not own the resource
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: Resource conflicts with an identifier, dependency, or immutable measurement unit
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ValidationError:
      description: Request validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ValidationErrorResponse' } } }
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        password_confirmation: { type: string, format: password }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    User:
      type: object
      required: [id, name, email]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string, format: email }
    UserResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/User' } }
    DeviceRequest:
      type: object
      additionalProperties: false
      required: [name, identifier]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        identifier: { type: string, minLength: 1, maxLength: 120 }
    DeviceUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        identifier: { type: string, minLength: 1, maxLength: 120 }
    Device:
      type: object
      required: [id, name, identifier, created_at, updated_at]
      properties:
        id: { type: string, format: ulid }
        name: { type: string }
        identifier: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DeviceResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/Device' } }
    DeviceCollectionResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Device' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    DeviceTokenResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [credential, token]
          properties:
            credential: { $ref: '#/components/schemas/DeviceCredential' }
            token:
              type: string
              pattern: '^sensorhub_[A-Za-z0-9_-]{43}$'
              description: Plaintext token with 256 random bits. Returned only once at creation or rotation.
    DeviceCredentialRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    DeviceCredential:
      type: object
      required: [id, device_id, name, created_at]
      properties:
        id: { type: string, format: ulid }
        device_id: { type: string, format: ulid }
        name: { type: string }
        last_used_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    SensorRequest:
      type: object
      additionalProperties: false
      required: [key, name, type]
      properties:
        key: { type: string, pattern: '^[a-z0-9_\\-]+$', maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [temperature, humidity, pressure, generic] }
        unit: { type: [string, 'null'], maxLength: 20 }
    SensorUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Key is immutable; unit may change only before the first measurement.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [temperature, humidity, pressure, generic] }
        unit: { type: [string, 'null'], maxLength: 20 }
    Sensor:
      type: object
      required: [id, device_id, key, name, type]
      properties:
        id: { type: string, format: ulid }
        device_id: { type: string, format: ulid }
        key: { type: string }
        name: { type: string }
        type: { type: string }
        unit: { type: [string, 'null'] }
    SensorResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/Sensor' } }
    SensorCollectionResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Sensor' } }
    Measurement:
      type: object
      required: [id, sensor_id, value, measured_at, created_at]
      properties:
        id: { type: string, format: ulid }
        sensor_id: { type: string, format: ulid }
        value: { type: number }
        unit: { type: [string, 'null'] }
        measured_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    MeasurementCollectionResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Measurement' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    TelemetryReading:
      type: object
      additionalProperties: false
      required: [sensor_key, value, measured_at]
      properties:
        sensor_key: { type: string, minLength: 1, maxLength: 80 }
        value: { type: number, description: Finite double-precision physical measurement }
        unit: { type: [string, 'null'], maxLength: 20 }
        measured_at: { type: string, format: date-time }
    TelemetryRequest:
      type: object
      additionalProperties: false
      required: [measurements]
      properties:
        measurements:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/TelemetryReading' }
    TelemetryResponse:
      type: object
      required: [accepted]
      properties:
        accepted: { type: integer, minimum: 0 }
    PaginationMeta:
      type: object
      required: [current_page, per_page, total]
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    ValidationErrorResponse:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
