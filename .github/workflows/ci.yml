name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure synthetic local environment
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env
      - name: Build and start application
        run: docker compose up -d --build --wait
      - name: Backend tests and formatting
        run: |
          docker compose exec -T backend php artisan test --compact
          docker compose exec -T backend vendor/bin/pint --test
      - name: Frontend tests, lint and build
        run: |
          docker compose exec -T frontend npm test
          docker compose exec -T frontend npm run lint
          docker compose exec -T frontend npm run build
      - name: Simulator build and tests
        run: |
          docker compose --profile simulator build simulator
          docker compose --profile simulator run --rm --no-deps simulator npm test
      - name: OpenAPI lint
        run: docker run --rm -v "$PWD:/work" -w /work node:22-alpine npx --yes @redocly/cli@2.55.0 lint docs/openapi.yaml
      - name: Service health
        run: |
          curl --fail http://localhost/api/v1/health
          curl --fail http://localhost/up
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=100
